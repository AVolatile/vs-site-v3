[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Explicit API aliases must precede the existing general page rewrite.
[[redirects]]
  from = "/api/inquiries"
  to = "/.netlify/functions/inquiries"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/inquiries"
  to = "/.netlify/functions/admin-inquiries"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/messages"
  to = "/.netlify/functions/admin-messages"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/bookings"
  to = "/.netlify/functions/admin-bookings"
  status = 200
  force = true

[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200
  force = true

[[redirects]]
  from = "/book/*"
  to = "/book/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/calendar/settings"
  to = "/admin/calendar/settings/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/calendar/settings"
  to = "/admin/login/?returnTo=%2Fadmin%2Fcalendar%2Fsettings%2F"
  status = 302
  force = true

[[redirects]]
  from = "/admin/calendar/settings/*"
  to = "/admin/calendar/settings/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/calendar/settings/*"
  to = "/admin/login/?returnTo=%2Fadmin%2Fcalendar%2Fsettings%2F"
  status = 302
  force = true

[[redirects]]
  from = "/admin/calendar"
  to = "/admin/calendar/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/calendar"
  to = "/admin/login/?returnTo=%2Fadmin%2Fcalendar%2F"
  status = 302
  force = true

[[redirects]]
  from = "/admin/calendar/*"
  to = "/admin/calendar/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/calendar/*"
  to = "/admin/login/?returnTo=%2Fadmin%2Fcalendar%2F"
  status = 302
  force = true

# Proposal APIs use the same server-side admin protection and explicit aliases.
[[redirects]]
  from = "/api/admin/proposals"
  to = "/.netlify/functions/admin-proposals"
  status = 200
  force = true

[[redirects]]
  from = "/api/proposal"
  to = "/.netlify/functions/proposal"
  status = 200
  force = true

[[redirects]]
  from = "/proposal/*"
  to = "/proposal/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/proposals"
  to = "/admin/proposals/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/proposals"
  to = "/admin/login/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/proposals/*"
  to = "/admin/proposals/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/proposals/*"
  to = "/admin/login/"
  status = 302
  force = true

# Public login/callback shell; no private inquiry data is embedded in it.
[[redirects]]
  from = "/admin/login"
  to = "/admin/login/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin"
  to = "/admin/login/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/admin/login/"
  status = 302
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Preview deployment — kazdy branch to osobna domena
[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

# Branch deploy — dla staging/produkcja
[context.branch-deploy]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Netlify zawsze serwuje po HTTPS, więc HSTS jest tu bezpieczny.
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    # Public image names are stable, so keep a short freshness window for replacements.
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# build.assets = '_assets' (astro.config.mjs) kieruje fingerprintowane zasoby do /_assets/.
# Mogą być buforowane immutable, ponieważ ich nazwy zawierają hash.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Retired Polish URLs redirect to the English homepage before general routing.
[[redirects]]
  from = "/pl"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pl/*"
  to = "/"
  status = 301
  force = true

# Przekierowania — trailing slash
[[redirects]]
  from = "/:path((?!.*\\.\\w+$).*)"
  to = "/:path/"
  status = 200

[[redirects]]
  from = "/studio"
  to = "/404/"
  status = 404

[[headers]]
  for = "/proposal/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"


[[headers]]
  for = "/book/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
