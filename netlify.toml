  force = true

[[redirects]]
  from = "/api/proposal"
  to = "/.netlify/functions/proposal"
  status = 200
  force = true

[[redirects]]
  from = "/proposal/*"
  to = "/proposal/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/proposals"
  to = "/admin/proposals/index.html"
