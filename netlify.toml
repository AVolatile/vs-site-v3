# Public login/callback shell; no private inquiry data is embedded in it.
[[redirects]]
  from = "/admin/login"
  to = "/admin/login/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin"
  to = "/admin/login/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/admin/login/"
  status = 302
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Preview deployment — kazdy branch to osobna domena
[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

# Branch deploy — dla staging/produkcja
[context.branch-deploy]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Netlify zawsze serwuje po HTTPS, więc HSTS jest tu bezpieczny.
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    # Public image names are stable, so keep a short freshness window for replacements.
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# build.assets = '_assets' (astro.config.mjs) kieruje fingerprintowane zasoby do /_assets/.
# Mogą być buforowane immutable, ponieważ ich nazwy zawierają hash.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Retired Polish URLs redirect to the English homepage before general routing.
[[redirects]]
  from = "/pl"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pl/*"
  to = "/"
  status = 301
  force = true


# Retired public URLs; no Terms page exists, so direct questions to project contact.
[[redirects]]
  from = "/about"
  to = "/#zespol"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/start-a-project/"
  status = 301
  force = true

[[redirects]]
  from = "/graphic-design"
  to = "/#services"
  status = 301
  force = true

[[redirects]]
