[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Phase 7 invoice routes, before general admin/static rewrites.
[[redirects]]
  from = "/api/admin/invoices"
  to = "/.netlify/functions/admin-invoices"
  status = 200
  force = true

[[redirects]]
  from = "/api/invoice"
  to = "/.netlify/functions/invoice"
  status = 200
  force = true

[[redirects]]
  from = "/invoice/*"
  to = "/invoice/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/invoices"
  to = "/admin/invoices/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/invoices"
  to = "/admin/login/?returnTo=%2Fadmin%2Finvoices%2F"
  status = 302
  force = true

[[redirects]]
  from = "/admin/invoices/*"
  to = "/admin/invoices/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/invoices/*"
  to = "/admin/login/?returnTo=%2Fadmin%2Finvoices%2F"
  status = 302
  force = true

