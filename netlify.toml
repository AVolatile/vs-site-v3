  force = true

# Przekierowania — trailing slash
[[redirects]]
  from = "/:path((?!.*\\.\\w+$).*)"
  to = "/:path/"
  status = 200

[[redirects]]
  from = "/studio"
  to = "/404/"
  status = 404

[[headers]]
  for = "/proposal/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"


[[headers]]
  for = "/book/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
